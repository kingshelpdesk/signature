<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>King&#8217;s Academy Email Signature</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;margin:0;padding:40px;color:#222}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:10}
#overlay.hidden{display:none}
.box{background:#fff;border-radius:10px;padding:28px 30px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.box h2{margin:0 0 18px;font-size:18px}
.box label{display:block;font-size:13px;margin:12px 0 4px;font-weight:bold}
.box label small{font-weight:normal;color:#888}
.box input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px}
.err{color:#c00;font-size:12px;min-height:16px;margin-top:8px}
button{background:#1f3a68;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer}
button.alt{background:#fff;color:#1f3a68;border:1px solid #1f3a68}
.box button{width:100%;margin-top:14px}
.card{background:#fff;border-radius:10px;padding:30px;display:inline-block;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
#msg{margin-top:12px;font-size:15px;color:#1a7f37;min-height:16px}
</style></head>
<body>
<div id="overlay"><form class="box" id="f" autocomplete="off">
<h2>Your signature details</h2>
<label>Full name</label><input id="i-name" required>
<label>Title</label><input id="i-title" required>
<label>Extension <small>(optional)</small></label><input id="i-ext" inputmode="numeric" placeholder="e.g. 1234">
<label>Mobile <small>(optional)</small></label><input id="i-mob" placeholder="+962 7X XXX XXXX">
<div class="err" id="err"></div>
<button type="submit">Create signature</button>
</form></div>

<div class="actions">
<button id="copy">Copy signature</button>
<button class="alt" id="dl">Download HTML</button>
<button class="alt" id="edit">Edit details</button>
</div>
<div id="msg"></div>

<script>
var $=function(id){return document.getElementById(id)};
function fill(){
  var n=$('i-name').value.trim().toUpperCase(),t=$('i-title').value.trim().toUpperCase(),e=$('i-ext').value.trim(),m=$('i-mob').value.trim();
  if(!n||!t){$('err').textContent='Please fill in name and title.';return false}
  $('s-name').textContent=n;$('s-title').textContent=t;$('s-ext').textContent=e;$('s-extwrap').style.display=e?'':'none';
  $('s-mob').textContent=m;$('s-mobrow').style.display=m?'':'none';
  $('err').textContent='';$('overlay').classList.add('hidden');$('msg').textContent='';return true;
}
$('f').addEventListener('submit',function(ev){ev.preventDefault();fill()});
$('edit').onclick=function(){$('overlay').classList.remove('hidden');$('i-name').focus()};
function sigHTML(){
  var c=$('sig').cloneNode(true),r=c.querySelector('#s-mobrow');
  if(r&&r.style.display==='none')r.parentNode.removeChild(r);
  var x=c.querySelector('#s-extwrap');if(x&&x.style.display==='none')x.parentNode.removeChild(x);
  c.querySelectorAll('[id]').forEach(function(el){el.removeAttribute('id')});
  return c.innerHTML.trim();
}
$('copy').onclick=function(){
  var html=sigHTML(),text=$('sig').innerText;
  function fallback(){
    var r=document.createRange();r.selectNode($('sig'));var s=getSelection();s.removeAllRanges();s.addRange(r);
    document.execCommand('copy');s.removeAllRanges();done();
  }
  function done(){$('msg').textContent='Copied! Paste it into your email signature settings.'}
  if(navigator.clipboard&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]).then(done,fallback);
  }else fallback();
};
$('dl').onclick=function(){
  var doc='<!DOCTYPE html>\n<html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>Signature</title></head>\n<body>\n'+sigHTML()+'\n</body></html>';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));
  var n=$('i-name').value.trim().replace(/[^A-Za-z0-9]+/g,'-')||'signature';
  a.download='KA-Signature-'+n+'.htm';a.click();
};
$('i-name').focus();
</script>
